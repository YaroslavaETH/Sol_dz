specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: WeValue
    network: sepolia
    source:
      address: "0x0A8F04D29977f58FC452c69f115fd598C4B0bf6d"
      abi: WeValue
      startBlock: 10279133
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AddCheckToWithdrawal
        - Approval
        - AssetsEvacuated
        - Donation
        - EIP712DomainChanged
        - EthConverted
        - Help
        - Initialized
        - OwnershipTransferred
        - ProtectedAssetRotated
        - SafeAssetChanged
        - Transfer
        - Upgraded
        - WithdrawalConfirmed
        - WithdrawalProtectedAsset
      abis:
        - name: WeValue
          file: ./abis/WeValue.json
      eventHandlers:
        - event: AddCheckToWithdrawal(indexed uint256,uint64,uint64,uint32,uint32)
          handler: handleAddCheckToWithdrawal
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: AssetsEvacuated(uint256,uint256)
          handler: handleAssetsEvacuated
        - event: Donation(indexed address,indexed uint256)
          handler: handleDonation
        - event: EIP712DomainChanged()
          handler: handleEIP712DomainChanged
        - event: EthConverted(uint256,uint256)
          handler: handleEthConverted
        - event: Help(indexed address,indexed uint256)
          handler: handleHelp
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: ProtectedAssetRotated(indexed address,indexed address)
          handler: handleProtectedAssetRotated
        - event: SafeAssetChanged(indexed address)
          handler: handleSafeAssetChanged
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Upgraded(indexed address)
          handler: handleUpgraded
        - event: WithdrawalConfirmed(indexed uint256)
          handler: handleWithdrawalConfirmed
        - event: WithdrawalProtectedAsset(indexed uint256,uint256,address,address,bool,string)
          handler: handleWithdrawalProtectedAsset
      file: ./src/we-value.ts
