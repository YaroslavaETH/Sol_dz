specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: WeValueProxy
    network: sepolia
    source:
      address: "0x9dECFb688Cc336442A581D280e748a0909348A45"
      abi: WeValueProxy
      startBlock: 10162440
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Upgraded
      abis:
        - name: WeValueProxy
          file: ./abis/WeValueProxy.json
      eventHandlers:
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/we-value-proxy.ts
